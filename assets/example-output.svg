  <path d="M0 0H1200V760H0V0Z" fill="url(#grid)" opacity=".48"/>
  <rect x="34" y="30" width="1132" height="700" fill="#F6F1E6" stroke="#151515" stroke-width="3"/>
  <rect x="34" y="30" width="1132" height="58" fill="#151515"/>
  <text x="62" y="67" fill="#F6F1E6" font-family="IBM Plex Mono, monospace" font-size="18" font-weight="700" letter-spacing="3">DESIGN-MCP / GENERATED SURFACE</text>
  <text x="1010" y="67" fill="#F56E1C" font-family="IBM Plex Mono, monospace" font-size="16" font-weight="700">GSAP READY</text>
  <g opacity=".9">
