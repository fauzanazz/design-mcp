    <text x="0" y="334" fill="#2A2A2A" font-family="IBM Plex Mono, monospace" font-size="21" font-weight="500">Two-pass generation: static layout first,</text>
    <text x="0" y="366" fill="#2A2A2A" font-family="IBM Plex Mono, monospace" font-size="21" font-weight="500">then a compact animation layer with GSAP.</text>
