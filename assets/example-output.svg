<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Example output generated by design-mcp</title>
  <desc id="desc">A stylized industrial landing page example with GSAP-style motion callouts.</desc>
