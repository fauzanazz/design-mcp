  <text x="828" y="205" fill="#151515" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="700">AMAZING VS SLOP SIGNALS</text>
  <g font-family="IBM Plex Mono, monospace" font-size="14" fill="#F6F1E6">
    <text x="828" y="276">✓ hard-edged visual system</text>
    <text x="828" y="314">✓ direction-specific typography</text>
    <text x="828" y="352">✓ animation after layout</text>
    <text x="828" y="390">✓ reduced-motion fallback</text>
